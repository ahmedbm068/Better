name = "better"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# The built web client, served by this same Worker. One origin for the app and
# its API: no CORS, no second host, and a content policy that stays 'self'.
#
# The Worker runs first and answers /health, /auth/*, /me and /changes; anything
# else falls through to these files.
[assets]
directory = "../out/web"
binding = "ASSETS"
# A refresh on any in-app route should get the app, not a 404.
not_found_handling = "single-page-application"
# Without this the asset layer answers browser navigations itself, before the
# Worker runs, and the SPA fallback above swallows /auth/github/start. It is
# invisible to a plain fetch: the interception keys off Sec-Fetch-Mode, which
# only a real navigation sends.
run_worker_first = ["/health", "/me", "/changes", "/auth/*", "/download"]

# D1 is SQLite, which is why the server and the desktop app share both the
# dialect and the merge rules in src/shared.
[[d1_databases]]
binding = "DB"
database_name = "better"
database_id = "5f9202bf-e9eb-4f69-b3ec-f3cb170a690d"

[vars]
# Where GitHub sends the browser back to. Must match the redirect URI on the
# OAuth app character for character, or GitHub refuses the exchange.
OAUTH_REDIRECT_URI = "https://better.a-benmasseoud23353.workers.dev/auth/github/callback"

# GITHUB_CLIENT_ID and GITHUB_CLIENT_SECRET are secrets, never vars:
#   npx wrangler secret put GITHUB_CLIENT_ID
#   npx wrangler secret put GITHUB_CLIENT_SECRET
