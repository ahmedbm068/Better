<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <!--
      The Worker serving this page is also its API, so nothing here needs a
      remote origin. `wasm-unsafe-eval` is what lets sql.js instantiate its
      module without opening the door to eval of script text.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'"
    />
    <title>Better</title>
    <style>
      /*
       * Inline so the splash paints before any stylesheet has loaded, which is
       * also why these four are the only hex values outside the token sheet:
       * nothing that reads a CSS variable exists yet. They are the night
       * palette's --bg, --text and --text3, and the day palette's --bg and
       * --text; if those change, change these or the app opens on a flash of
       * the wrong colour.
       */
      html { background: #0e0d14; color: #edebf2; }
      body { margin: 0; font: 15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; }
      #splash {
        position: fixed; inset: 0; display: grid; place-content: center;
        gap: 0.75rem; text-align: center; padding: 2rem;
      }
      #splash h1 { margin: 0; font-size: 1.5rem; font-weight: 600; letter-spacing: -0.01em; }
      #splash-status { margin: 0; color: #7d7992; font-size: 0.9rem; }
      @media (prefers-color-scheme: light) {
        html:not([data-theme='dark']) { background: #f3f3f7; color: #1a1826; }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <h1>Better</h1>
      <p id="splash-status">Starting...</p>
    </div>
    <div id="root"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
