name = "better-sync"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# D1 is SQLite, which is why the server and the desktop app can share both the
# dialect and the merge rules in src/shared.
[[d1_databases]]
binding = "DB"
database_name = "better"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"

[vars]
# Set for local development. In production put the real values in the dashboard
# or with `wrangler secret put`, never here.
OAUTH_REDIRECT_URI = "http://localhost:8787/auth/github/callback"

# GITHUB_CLIENT_ID and GITHUB_CLIENT_SECRET are secrets:
#   wrangler secret put GITHUB_CLIENT_ID
#   wrangler secret put GITHUB_CLIENT_SECRET
